<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QR Attendance Scanner</title>

  <!-- html5-qrcode library -->
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <!-- Fonts -->
  <link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,600,700&display=swap" rel="stylesheet" />

  <style>
    /* ─── Design Tokens ─────────────────────────────────────── */
    :root {
      --text-xs: clamp(0.75rem, 0.7rem + 0.25vw, 0.875rem);
      --text-sm: clamp(0.875rem, 0.8rem + 0.35vw, 1rem);
      --text-base: clamp(1rem, 0.95rem + 0.25vw, 1.125rem);
      --text-lg: clamp(1.125rem, 1rem + 0.75vw, 1.5rem);
      --text-xl: clamp(1.5rem, 1.2rem + 1.25vw, 2.25rem);

      --space-1: 0.25rem;
      --space-2: 0.5rem;
      --space-3: 0.75rem;
      --space-4: 1rem;
      --space-5: 1.25rem;
      --space-6: 1.5rem;
      --space-8: 2rem;
      --space-10: 2.5rem;
      --space-12: 3rem;

      --radius-sm: 0.375rem;
      --radius-md: 0.5rem;
      --radius-lg: 0.75rem;
      --radius-xl: 1rem;
      --radius-full: 9999px;

      --transition: 180ms cubic-bezier(0.16, 1, 0.3, 1);
      --font-body: 'Satoshi', 'Inter', sans-serif;
    }

    /* Light mode */
    :root,
    [data-theme="light"] {
      --bg: #f7f6f2;
      --surface: #f9f8f5;
      --surface-2: #ffffff;
      --border: oklch(0.2 0.01 80 / 0.12);
      --text: #28251d;
      --text-muted: #7a7974;
      --text-faint: #bab9b4;
      --primary: #01696f;
      --primary-hover: #0c4e54;
      --primary-hl: #cedcd8;
      --success: #437a22;
      --success-hl: #d4dfcc;
      --error: #a12c7b;
      --error-hl: #e0ced7;
      --warning: #964219;
      --warning-hl: #ddcfc6;
      --shadow-sm: 0 1px 2px oklch(0.2 0.01 80 / 0.06);
      --shadow-md: 0 4px 12px oklch(0.2 0.01 80 / 0.08);
      --shadow-lg: 0 12px 32px oklch(0.2 0.01 80 / 0.12);
    }

    /* Dark mode */
    [data-theme="dark"] {
      --bg: #171614;
      --surface: #1c1b19;
      --surface-2: #201f1d;
      --border: oklch(1 0 0 / 0.08);
      --text: #cdccca;
      --text-muted: #797876;
      --text-faint: #5a5957;
      --primary: #4f98a3;
      --primary-hover: #227f8b;
      --primary-hl: #313b3b;
      --success: #6daa45;
      --success-hl: #3a4435;
      --error: #d163a7;
      --error-hl: #4c3d46;
      --warning: #bb653b;
      --warning-hl: #564942;
      --shadow-sm: 0 1px 2px oklch(0 0 0 / 0.2);
      --shadow-md: 0 4px 12px oklch(0 0 0 / 0.3);
      --shadow-lg: 0 12px 32px oklch(0 0 0 / 0.4);
    }

    /* ─── Base ───────────────────────────────────────────────── */
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      -webkit-text-size-adjust: none;
      text-size-adjust: none;
      -webkit-font-smoothing: antialiased;
      scroll-behavior: smooth;
    }

    body {
      min-height: 100dvh;
      font-family: var(--font-body);
      font-size: var(--text-base);
      color: var(--text);
      background: var(--bg);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: var(--space-6) var(--space-4);
      transition: background var(--transition), color var(--transition);
    }

    img,
    svg {
      display: block;
    }

    button {
      cursor: pointer;
      border: none;
      background: none;
      font: inherit;
      color: inherit;
    }

    ::selection {
      background: oklch(from var(--primary) l c h / 0.25);
      color: var(--text);
    }

    :focus-visible {
      outline: 2px solid var(--primary);
      outline-offset: 3px;
      border-radius: var(--radius-sm);
    }

    @media (prefers-reduced-motion: reduce) {

      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }

    /* ─── Layout ─────────────────────────────────────────────── */
    .page {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: var(--space-6);
    }

    /* ─── Header ─────────────────────────────────────────────── */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: var(--space-4);
      border-bottom: 1px solid var(--border);
    }

    .logo {
      display: flex;
      align-items: center;
      gap: var(--space-3);
    }

    .logo-icon {
      width: 36px;
      height: 36px;
      background: var(--primary);
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .logo-icon svg {
      color: #fff;
    }

    .logo-text {
      font-size: var(--text-base);
      font-weight: 700;
      color: var(--text);
      line-height: 1.2;
    }

    .logo-sub {
      font-size: var(--text-xs);
      color: var(--text-muted);
      font-weight: 400;
    }

    .theme-btn {
      width: 36px;
      height: 36px;
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      border: 1px solid var(--border);
      transition: color var(--transition), border-color var(--transition), background var(--transition);
    }

    .theme-btn:hover {
      color: var(--text);
      background: var(--surface-2);
    }

    /* ─── Scanner Card ───────────────────────────────────────── */
    .scanner-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow-md);
      overflow: hidden;
    }

    .scanner-header {
      padding: var(--space-4) var(--space-5);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .scanner-title {
      font-size: var(--text-sm);
      font-weight: 600;
      color: var(--text);
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: var(--radius-full);
      background: var(--text-faint);
      transition: background var(--transition);
    }

    .status-dot.active {
      background: var(--success);
      box-shadow: 0 0 6px oklch(from var(--success) l c h / 0.5);
    }

    .status-dot.error {
      background: var(--error);
    }

    /* Viewfinder */
    .viewfinder-wrap {
      position: relative;
      background: #000;
      aspect-ratio: 1 / 1;
      overflow: hidden;
    }

    #reader {
      width: 100% !important;
      border: none !important;
    }

    /* Override html5-qrcode default ugly styles */
    #reader>* {
      border: none !important;
    }

    #reader video {
      object-fit: cover !important;
    }

    #reader img {
      display: none !important;
    }

    #reader__scan_region {
      background: transparent !important;
      border: none !important;
    }

    #reader__scan_region>img {
      display: none !important;
    }

    #reader__dashboard {
      display: none !important;
    }

    /* Corner guides */
    .corners {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 10;
    }

    .corner {
      position: absolute;
      width: 28px;
      height: 28px;
      border-color: var(--primary);
      border-style: solid;
    }

    .corner-tl {
      top: 20px;
      left: 20px;
      border-width: 3px 0 0 3px;
      border-radius: 4px 0 0 0;
    }

    .corner-tr {
      top: 20px;
      right: 20px;
      border-width: 3px 3px 0 0;
      border-radius: 0 4px 0 0;
    }

    .corner-bl {
      bottom: 20px;
      left: 20px;
      border-width: 0 0 3px 3px;
      border-radius: 0 0 0 4px;
    }

    .corner-br {
      bottom: 20px;
      right: 20px;
      border-width: 0 3px 3px 0;
      border-radius: 0 0 4px 0;
    }

    /* Scan line animation */
    @keyframes scanline {
      0% {
        top: 10%;
        opacity: 1;
      }

      45% {
        opacity: 1;
      }

      50% {
        top: 90%;
        opacity: 0.6;
      }

      55% {
        opacity: 1;
      }

      100% {
        top: 10%;
        opacity: 1;
      }
    }

    .scan-line {
      position: absolute;
      left: 12px;
      right: 12px;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--primary), transparent);
      border-radius: 2px;
      animation: scanline 2.4s ease-in-out infinite;
      z-index: 11;
      pointer-events: none;
      opacity: 0;
      transition: opacity var(--transition);
    }

    .scan-line.visible {
      opacity: 1;
    }

    /* Idle placeholder */
    .viewfinder-idle {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: var(--space-3);
      background: var(--surface-2);
      z-index: 5;
      transition: opacity var(--transition);
    }

    .viewfinder-idle.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .idle-icon {
      color: var(--text-faint);
    }

    .idle-text {
      font-size: var(--text-sm);
      color: var(--text-muted);
      text-align: center;
      max-width: 200px;
      line-height: 1.5;
    }

    /* ─── Controls ───────────────────────────────────────────── */
    .controls {
      padding: var(--space-4) var(--space-5);
      display: flex;
      gap: var(--space-3);
    }

    .btn {
      flex: 1;
      height: 44px;
      border-radius: var(--radius-lg);
      font-size: var(--text-sm);
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: var(--space-2);
      transition: background var(--transition), color var(--transition), opacity var(--transition), box-shadow var(--transition);
    }

    .btn:active {
      transform: scale(0.97);
    }

    .btn-primary {
      background: var(--primary);
      color: #fff;
    }

    .btn-primary:hover {
      background: var(--primary-hover);
    }

    .btn-primary:disabled {
      opacity: 0.45;
      pointer-events: none;
    }

    .btn-ghost {
      background: transparent;
      color: var(--text-muted);
      border: 1px solid var(--border);
    }

    .btn-ghost:hover {
      background: var(--surface-2);
      color: var(--text);
    }

    .btn-ghost:disabled {
      opacity: 0.45;
      pointer-events: none;
    }

    /* ─── Feedback Banner ────────────────────────────────────── */
    .feedback {
      border-radius: var(--radius-xl);
      overflow: hidden;
      box-shadow: var(--shadow-md);
      transition: opacity var(--transition), transform var(--transition);
    }

    .feedback.hidden {
      opacity: 0;
      pointer-events: none;
      transform: translateY(8px);
    }

    .feedback-inner {
      display: flex;
      align-items: flex-start;
      gap: var(--space-4);
      padding: var(--space-4) var(--space-5);
    }

    .feedback-icon-wrap {
      width: 40px;
      height: 40px;
      border-radius: var(--radius-full);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      margin-top: 2px;
    }

    .feedback-body {
      flex: 1;
      min-width: 0;
    }

    .feedback-label {
      font-size: var(--text-xs);
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: var(--space-1);
    }

    .feedback-name {
      font-size: var(--text-lg);
      font-weight: 700;
      line-height: 1.2;
      margin-bottom: var(--space-1);
    }

    .feedback-meta {
      font-size: var(--text-xs);
      color: var(--text-muted);
    }

    /* States */
    .feedback.state-in {
      background: var(--success-hl);
    }

    .feedback.state-out {
      background: var(--warning-hl);
    }

    .feedback.state-error {
      background: var(--error-hl);
    }

    .feedback.state-info {
      background: var(--primary-hl);
    }

    .feedback.state-in .feedback-label {
      color: var(--success);
    }

    .feedback.state-out .feedback-label {
      color: var(--warning);
    }

    .feedback.state-error .feedback-label {
      color: var(--error);
    }

    .feedback.state-info .feedback-label {
      color: var(--primary);
    }

    .feedback.state-in .feedback-icon-wrap {
      background: var(--success);
    }

    .feedback.state-out .feedback-icon-wrap {
      background: var(--warning);
    }

    .feedback.state-error .feedback-icon-wrap {
      background: var(--error);
    }

    .feedback.state-info .feedback-icon-wrap {
      background: var(--primary);
    }

    /* ─── Log Table ──────────────────────────────────────────── */
    .log-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow-sm);
      overflow: hidden;
    }

    .log-card-header {
      padding: var(--space-4) var(--space-5);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .log-title {
      font-size: var(--text-sm);
      font-weight: 600;
      color: var(--text);
    }

    .log-count {
      font-size: var(--text-xs);
      font-weight: 600;
      color: var(--text-muted);
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: var(--radius-full);
      padding: 2px var(--space-2);
    }

    .log-list {
      list-style: none;
      max-height: 260px;
      overflow-y: auto;
    }

    .log-list::-webkit-scrollbar {
      width: 4px;
    }

    .log-list::-webkit-scrollbar-track {
      background: transparent;
    }

    .log-list::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 2px;
    }

    .log-item {
      display: grid;
      grid-template-columns: 1fr auto auto;
      align-items: center;
      gap: var(--space-3);
      padding: var(--space-3) var(--space-5);
      border-bottom: 1px solid var(--border);
      animation: slideIn 0.25s ease;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(-6px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .log-item:last-child {
      border-bottom: none;
    }

    .log-item-name {
      font-size: var(--text-sm);
      font-weight: 500;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .log-item-time {
      font-size: var(--text-xs);
      color: var(--text-muted);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .badge {
      font-size: var(--text-xs);
      font-weight: 700;
      letter-spacing: 0.06em;
      padding: 2px var(--space-2);
      border-radius: var(--radius-full);
      white-space: nowrap;
    }

    .badge-in {
      background: var(--success-hl);
      color: var(--success);
    }

    .badge-out {
      background: var(--warning-hl);
      color: var(--warning);
    }

    .badge-error {
      background: var(--error-hl);
      color: var(--error);
    }

    /* Empty log state */
    .log-empty {
      padding: var(--space-10) var(--space-4);
      text-align: center;
      color: var(--text-muted);
      font-size: var(--text-sm);
    }

    .log-empty svg {
      margin: 0 auto var(--space-3);
      color: var(--text-faint);
    }

    /* ─── Loading Spinner ────────────────────────────────────── */
    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .spinner {
      width: 16px;
      height: 16px;
      border: 2px solid oklch(from currentColor l c h / 0.3);
      border-top-color: currentColor;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      flex-shrink: 0;
    }

    /* ─── Footer ─────────────────────────────────────────────── */
    .footer {
      text-align: center;
      font-size: var(--text-xs);
      color: var(--text-faint);
      padding-top: var(--space-2);
    }
  </style>
</head>

<body>

  <div class="page">

    <!-- Header -->
    <header class="header">
      <div class="logo">
        <div class="logo-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="3" y="3" width="7" height="7" rx="1" />
            <rect x="14" y="3" width="7" height="7" rx="1" />
            <rect x="3" y="14" width="7" height="7" rx="1" />
            <rect x="14" y="14" width="3" height="3" rx="0.5" />
            <rect x="19" y="14" width="2" height="2" rx="0.5" />
            <rect x="14" y="19" width="2" height="2" rx="0.5" />
            <rect x="18" y="19" width="3" height="2" rx="0.5" />
          </svg>
        </div>
        <div>
          <div class="logo-text">QR Attendance</div>
          <div class="logo-sub">Digital Entry Logger</div>
        </div>
      </div>
      <button class="theme-btn" data-theme-toggle aria-label="Switch to light mode">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
        </svg>
      </button>
    </header>

    <!-- Scanner Card -->
    <div class="scanner-card" role="region" aria-label="QR Scanner">
      <div class="scanner-header">
        <span class="scanner-title">Camera Scanner</span>
        <div class="status-dot" id="statusDot" aria-hidden="true"></div>
      </div>

      <div class="viewfinder-wrap">
        <div id="reader"></div>

        <div class="corners" id="corners" style="display:none">
          <div class="corner corner-tl"></div>
          <div class="corner corner-tr"></div>
          <div class="corner corner-bl"></div>
          <div class="corner corner-br"></div>
          <div class="scan-line" id="scanLine"></div>
        </div>

        <div class="viewfinder-idle" id="idlePlaceholder">
          <svg class="idle-icon" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7" />
            <rect x="7" y="7" width="4" height="4" rx="0.5" />
            <rect x="13" y="13" width="4" height="4" rx="0.5" />
          </svg>
          <p class="idle-text">Tap <strong>Start Scanner</strong> to begin scanning QR codes</p>
        </div>
      </div>

      <div class="controls">
        <button class="btn btn-primary" id="startBtn" onclick="startScanner()">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
            stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <polygon points="5 3 19 12 5 21 5 3" />
          </svg>
          Start Scanner
        </button>
        <button class="btn btn-ghost" id="stopBtn" onclick="stopScanner()" disabled>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
            stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="6" y="6" width="12" height="12" rx="1" />
          </svg>
          Stop
        </button>
      </div>
    </div>

    <!-- Feedback Banner -->
    <div class="feedback hidden" id="feedbackBanner" role="alert" aria-live="polite">
      <div class="feedback-inner">
        <div class="feedback-icon-wrap" id="feedbackIcon"></div>
        <div class="feedback-body">
          <div class="feedback-label" id="feedbackLabel">—</div>
          <div class="feedback-name" id="feedbackName">—</div>
          <div class="feedback-meta" id="feedbackMeta">—</div>
        </div>
      </div>
    </div>

    <!-- Recent Logs -->
    <div class="log-card" role="region" aria-label="Recent Scans">
      <div class="log-card-header">
        <span class="log-title">Recent Scans</span>
        <span class="log-count" id="logCount">0</span>
      </div>
      <ul class="log-list" id="logList" role="list">
        <li class="log-empty" id="logEmpty">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"
            stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
            <polyline points="14 2 14 8 20 8" />
            <line x1="16" y1="13" x2="8" y2="13" />
            <line x1="16" y1="17" x2="8" y2="17" />
            <polyline points="10 9 9 9 8 9" />
          </svg>
          No scans yet — start the scanner above
        </li>
      </ul>
    </div>

    <p class="footer">Powered by Google Apps Script &amp; html5-qrcode</p>
  </div>

  <script>
    /* ─── State ─────────────────────────────────────────────────── */
    let scanner = null;
    let scanning = false;
    let processing = false;
    let resumeTimer = null;
    const COOLDOWN_MS = 3000;

    /* ─── Theme Toggle ──────────────────────────────────────────── */
    (function () {
      const root = document.documentElement;
      const btn = document.querySelector('[data-theme-toggle]');
      const SUN = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>`;
      const MOON = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>`;
      let theme = 'dark';
      root.setAttribute('data-theme', theme);
      btn.innerHTML = MOON;
      btn.addEventListener('click', () => {
        theme = theme === 'dark' ? 'light' : 'dark';
        root.setAttribute('data-theme', theme);
        btn.innerHTML = theme === 'dark' ? MOON : SUN;
        btn.setAttribute('aria-label', 'Switch to ' + (theme === 'dark' ? 'light' : 'dark') + ' mode');
      });
    })();

    /* ─── Scanner ───────────────────────────────────────────────── */
    // Google Apps Script serves this page inside a sandboxed iframe
    // on googleusercontent.com WITHOUT allow="camera".  The browser
    // will ALWAYS block getUserMedia() inside this iframe — no prompt
    // is shown.  The workaround: open a lightweight scanner page in
    // a NEW popup window (top-level context) that CAN access the
    // camera.  Scanned results are sent back via postMessage.

    let scannerWindow = null;

    // Listen for scanned QR results coming from the popup
    window.addEventListener('message', function (e) {
      // Accept messages only from our scanner popup
      if (!e.data || e.data.type !== 'qr-scan-result') return;
      const qrData = e.data.payload;
      if (qrData && !processing) {
        processing = true;
        showFeedback('info', 'Processing…', 'Validating QR code with server', null, true);
        sendToBackend(qrData);
      }
    });

    function startScanner() {
      if (scanning) return;

      // Try inline camera first (works on desktop / non-GAS contexts)
      const isIframe = (() => { try { return window !== window.top; } catch (_) { return true; } })();

      if (!isIframe) {
        // Not inside an iframe — use inline scanner directly
        startInlineScanner();
        return;
      }

      // Inside GAS iframe — open scanner in a popup window
      openScannerPopup();
    }

    function startInlineScanner() {
      const config = { fps: 10, qrbox: { width: 220, height: 220 }, aspectRatio: 1.0 };
      scanner = new Html5Qrcode('reader');
      scanner.start({ facingMode: 'environment' }, config, onScanSuccess, onScanError)
        .then(() => { scanning = true; setScanningUI(true); })
        .catch(err => {
          console.error('Inline camera error:', err);
          // Fallback to popup even on desktop if inline fails
          openScannerPopup();
        });
    }

    function openScannerPopup() {
      scanning = true;
      setScanningUI(true);
      showFeedback('info', 'Scanner Opening…', 'A camera window will open — allow camera access there', null, true);

      // Build a self-contained HTML page for the popup
      const popupHTML = `<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>QR Scanner</title>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"><\/script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,sans-serif;background:#111;color:#eee;
  display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:16px}
h2{font-size:1.1rem;margin-bottom:12px;text-align:center;opacity:.85}
#qr-reader{width:100%;max-width:400px;border-radius:12px;overflow:hidden}
#qr-reader video{object-fit:cover!important}
#qr-reader__dashboard{background:#222!important;border:none!important;padding:8px!important}
#qr-reader__dashboard button{background:#01696f!important;color:#fff!important;
  border:none!important;border-radius:8px!important;padding:10px 16px!important;
  font-size:.9rem!important;font-weight:600!important;cursor:pointer!important}
.status{margin-top:16px;padding:12px 20px;border-radius:10px;text-align:center;
  font-size:.9rem;max-width:400px;width:100%;min-height:44px}
.status.ok{background:#1b3a1b;color:#6daa45}
.status.err{background:#3a1b2b;color:#d163a7}
.status.wait{background:#1b2a3a;color:#4f98a3}
.close-btn{margin-top:16px;padding:12px 32px;background:#333;color:#eee;
  border:none;border-radius:10px;font-size:.9rem;font-weight:600;cursor:pointer}
.close-btn:active{background:#444}
</style>
</head>
<body>
<h2>📷 Scan a QR Code</h2>
<div id="qr-reader"></div>
<div class="status wait" id="status">Requesting camera access…</div>
<button class="close-btn" onclick="cleanup();window.close()">✕ Close Scanner</button>
<script>
let lastSent='', html5Qr=null;
function cleanup(){try{if(html5Qr)html5Qr.stop()}catch(_){}}
function init(){
  html5Qr=new Html5Qrcode('qr-reader');
  html5Qr.start(
    {facingMode:'environment'},
    {fps:10,qrbox:{width:220,height:220},aspectRatio:1.0},
    function(decoded){
      if(decoded===lastSent)return;
      lastSent=decoded;
      document.getElementById('status').className='status ok';
      document.getElementById('status').textContent='✓ Scanned! Sending…';
      if(window.opener){
        window.opener.postMessage({type:'qr-scan-result',payload:decoded},'*');
      }
      // Allow re-scan after 3 seconds
      setTimeout(function(){lastSent='';
        document.getElementById('status').className='status wait';
        document.getElementById('status').textContent='Ready — scan another QR code';
      },3000);
    },
    function(){}
  ).then(function(){
    document.getElementById('status').className='status ok';
    document.getElementById('status').textContent='Camera ready — point at a QR code';
  }).catch(function(err){
    document.getElementById('status').className='status err';
    document.getElementById('status').textContent='Camera error: '+(err.message||err);
  });
}
init();
window.addEventListener('beforeunload',cleanup);
<\/script>
</body>
</html>`;

      // Open popup and write scanner HTML into it
      scannerWindow = window.open('', '_blank', 'width=420,height=620,menubar=no,toolbar=no');
      if (!scannerWindow) {
        showFeedback('error', 'Popup Blocked',
          'Your browser blocked the scanner popup. Please allow popups for this site and try again.',
          'Tap the popup-blocked icon in the address bar');
        scanning = false;
        setScanningUI(false);
        return;
      }
      scannerWindow.document.open();
      scannerWindow.document.write(popupHTML);
      scannerWindow.document.close();

      // Monitor popup — when user closes it, reset UI
      const popupCheck = setInterval(() => {
        if (scannerWindow && scannerWindow.closed) {
          clearInterval(popupCheck);
          scanning = false;
          setScanningUI(false);
          showFeedback('info', 'Scanner Closed', 'Tap Start Scanner to scan again', null);
        }
      }, 500);
    }

    function stopScanner() {
      clearTimeout(resumeTimer);
      // Stop inline scanner if active
      if (scanner && scanning) {
        scanner.stop().then(() => {
          scanner.clear();
        }).catch(console.error);
      }
      // Close popup scanner if active
      if (scannerWindow && !scannerWindow.closed) {
        scannerWindow.close();
      }
      scanner = null;
      scanning = false;
      processing = false;
      setScanningUI(false);
    }

    function setScanningUI(active) {
      document.getElementById('startBtn').disabled = active;
      document.getElementById('stopBtn').disabled = !active;
      document.getElementById('statusDot').className = 'status-dot' + (active ? ' active' : '');
      document.getElementById('corners').style.display = active ? 'block' : 'none';
      document.getElementById('idlePlaceholder').className = 'viewfinder-idle' + (active ? ' hidden' : '');
      const line = document.getElementById('scanLine');
      if (active) setTimeout(() => line.classList.add('visible'), 100);
      else line.classList.remove('visible');
    }

    /* ─── QR Callbacks ──────────────────────────────────────────── */
    function onScanSuccess(decodedText) {
      if (processing) return;
      processing = true;
      document.getElementById('scanLine').style.animationPlayState = 'paused';
      showFeedback('info', 'Processing…', 'Validating QR code with server', null, true);
      sendToBackend(decodedText);
    }

    function onScanError(err) {
      // Suppress continuous "no QR in frame" noise from html5-qrcode
      if (!err) return;
      const msg = typeof err === 'string' ? err : (err.message || '');
      if (msg.toLowerCase().includes('no qr') || msg.toLowerCase().includes('no multi')) return;
    }

    /* ─── Backend Communication ─────────────────────────────────── */
    function sendToBackend(qrData) {
      let payload;
      try { payload = JSON.parse(qrData); }
      catch (_) { payload = qrData; }

      if (typeof google !== 'undefined' && google.script && google.script.run) {
        // Production: Apps Script
        google.script.run
          .withSuccessHandler(handleServerResponse)
          .withFailureHandler(handleServerError)
          .logEntry(typeof payload === 'object' ? JSON.stringify(payload) : payload);
      } else {
        // Dev mock — works when opening the file directly in browser
        setTimeout(() => {
          const mock = [
            { status: 'success', name: 'Riya Sharma', action: 'IN', userId: 'USR_001', time: new Date().toISOString() },
            { status: 'success', name: 'Arjun Mehta', action: 'OUT', userId: 'USR_002', time: new Date().toISOString() },
            { status: 'error', message: 'User not found in database' },
          ];
          handleServerResponse(mock[Math.floor(Math.random() * mock.length)]);
        }, 900);
      }
    }

    function handleServerResponse(res) {
      if (!res) { handleServerError('Empty response from server'); return; }

      if (res.status === 'success') {
        const action = (res.action || '').toUpperCase();
        const time = res.time ? formatTime(res.time) : formatTime(new Date().toISOString());
        showFeedback(
          action === 'IN' ? 'in' : 'out',
          action === 'IN' ? '✓ Checked In' : '✓ Checked Out',
          res.name || res.userId,
          (res.userId || '') + '  •  ' + time
        );
        addLogEntry(res.name || res.userId, action, time, action === 'IN' ? 'in' : 'out');
      } else if (res.status === 'duplicate') {
        showFeedback('error', 'Already Scanned', res.message || 'Too soon — please wait a moment', null);
      } else {
        showFeedback('error', 'Invalid QR', res.message || 'This QR code is not recognized', null);
      }
      scheduleResume();
    }

    function handleServerError(err) {
      console.error('Server error:', err);
      const msg = typeof err === 'string' ? err : (err && err.message ? err.message : 'Server connection failed');
      showFeedback('error', 'Connection Error', msg, null);
      scheduleResume();
    }

    function scheduleResume() {
      clearTimeout(resumeTimer);
      resumeTimer = setTimeout(() => {
        processing = false;
        document.getElementById('scanLine').style.animationPlayState = 'running';
      }, COOLDOWN_MS);
    }

    /* ─── Feedback Banner ────────────────────────────────────────── */
    const ICONS = {
      in: '<polyline points="20 6 9 17 4 12"/>',
      out: '<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/>',
      error: '<circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/>',
      info: '<circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>',
    };

    function showFeedback(state, label, name, meta, isLoading = false) {
      const banner = document.getElementById('feedbackBanner');
      banner.className = 'feedback state-' + state;
      document.getElementById('feedbackLabel').textContent = label;
      document.getElementById('feedbackName').textContent = name || '';
      document.getElementById('feedbackMeta').textContent = meta || '';
      if (isLoading) {
        document.getElementById('feedbackIcon').innerHTML = '<div class="spinner" style="border-top-color:#fff;"></div>';
      } else {
        document.getElementById('feedbackIcon').innerHTML =
          '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + (ICONS[state] || ICONS.info) + '</svg>';
      }
    }

    /* ─── Log List ───────────────────────────────────────────────── */
    let logCount = 0;

    function addLogEntry(name, action, time, badgeClass) {
      const empty = document.getElementById('logEmpty');
      if (empty) empty.remove();
      logCount++;
      document.getElementById('logCount').textContent = logCount;
      const list = document.getElementById('logList');
      const li = document.createElement('li');
      li.className = 'log-item';
      li.innerHTML =
        '<span class="log-item-name">' + escHtml(name) + '</span>' +
        '<span class="log-item-time">' + escHtml(time) + '</span>' +
        '<span class="badge badge-' + escHtml(badgeClass) + '">' + escHtml(action) + '</span>';
      list.insertBefore(li, list.firstChild);
      while (list.children.length > 50) list.removeChild(list.lastChild);
    }

    /* ─── Helpers ────────────────────────────────────────────────── */
    function formatTime(iso) {
      try {
        return new Date(iso).toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
      } catch (_) { return iso; }
    }

    function escHtml(str) {
      return String(str).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }
  </script>
</body>

</html>
